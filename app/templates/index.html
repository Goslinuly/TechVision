<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aqıqat — проверка информации</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --fg:#1a1c1e; --muted:#62676c;
            --border:#e4e7eb; --accent:#2f6b4f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16181c; --card:#1f2226; --fg:#e8eaed; --muted:#9aa0a6;
              --border:#2c3036; --accent:#6fcf97; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .wrap { max-width:640px; margin:0 auto; padding:32px 16px 64px; }
    h1 { margin:0 0 4px; font-size:26px; }
    .tag { color:var(--muted); margin-bottom:24px; }
    .card { background:var(--card); border:1px solid var(--border);
      border-radius:14px; padding:20px; }
    textarea { width:100%; min-height:120px; resize:vertical; padding:12px;
      border:1px solid var(--border); border-radius:10px; background:var(--bg);
      color:var(--fg); font:inherit; }
    button { margin-top:12px; background:var(--accent); color:#fff; border:0;
      border-radius:10px; padding:11px 18px; font:inherit; font-weight:600;
      cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    #out { margin-top:16px; white-space:pre-wrap; font-size:15px; }
    #out a { color:var(--accent); }
    .note { color:var(--muted); font-size:13px; margin-top:20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Aqıqat</h1>
    <div class="tag">Объяснимый разбор сообщений против информационного шума · kk / ru</div>
    <div class="card">
      <textarea id="text" placeholder="Вставьте пересланное сообщение…"></textarea>
      <button id="go" onclick="run()">Разобрать</button>
      <div id="out"></div>
    </div>
    <div class="note">
      Мы не выносим вердикт «97% фейк». Показываем, что проверяемо, что нашлось
      в базах фактчекеров и какие манипулятивные приёмы использованы.
    </div>
  </div>
  <script>
    async function run() {
      const btn = document.getElementById('go');
      const out = document.getElementById('out');
      const text = document.getElementById('text').value.trim();
      if (!text) { out.textContent = 'Введите текст.'; return; }
      btn.disabled = true; out.textContent = 'Разбираю…';
      try {
        const r = await fetch('/analyze', {
          method: 'POST', headers: {'content-type': 'application/json'},
          body: JSON.stringify({text})
        });
        const data = await r.json();
        out.textContent = data.chat_text + '\n\n';
        const a = document.createElement('a');
        a.href = data.url; a.textContent = 'Открыть полный разбор →';
        a.target = '_blank'; out.appendChild(a);
      } catch (e) {
        out.textContent = 'Ошибка: ' + e;
      } finally { btn.disabled = false; }
    }
  </script>
</body>
</html>
